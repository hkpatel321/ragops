name: RAGOps CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Configuration & Imports
        run: |
          python -c "from src.config import load_config; cfg = load_config(); print('Config valid:', cfg.project.name)"

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests
