name: RAGOps Continuous Integration & Quality Gate

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'data/**'
      - 'eval/**'
      - 'scripts/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'data/**'
      - 'eval/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  rag-ci-pipeline:
    name: Lint, Test, Build, Evaluate & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (ruff)
        run: |
          ruff check .

      - name: Fetch Documentation
        run: |
          python scripts/fetch_docs.py --version v1
          python scripts/fetch_docs.py --version v2

      - name: Run Unit Tests
        env:
          MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
        run: |
          python -m unittest discover -s tests

      - name: Build Vector Index (v1)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
        run: |
          python scripts/build_index.py --data-version v1

      - name: Run Offline Evaluation (Reduced Golden Subset)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
        run: |
          python scripts/run_eval.py \
            --golden-set eval/golden_v1.jsonl \
            --data-version v1 \
            --limit 10 \
            --mock-llm \
            --output-report eval/eval_report_latest.json

      - name: Quality Gate & Regression Verification
        env:
          MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
        run: |
          python scripts/quality_gate.py \
            --report eval/eval_report_latest.json \
            --max-regression-pct 10.0 \
            --markdown-output eval/quality_gate_summary.md

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragops-eval-artifacts
          path: |
            eval/eval_report_latest.json
            eval/quality_gate_summary.md

      - name: Comment Results Table on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summaryPath = 'eval/quality_gate_summary.md';
            if (fs.existsSync(summaryPath)) {
              const body = fs.readFileSync(summaryPath, 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
